[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apostate"
version = "1.0.0"
description = "Build fixed-weight KCRN checkpoints for authorized model research"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

# heavy ml deps are installed by `apostate setup` or requirements.txt:
# torch transformers datasets safetensors optuna bitsandbytes

[project.scripts]
apostate = "apostate.__main__:main"

[tool.setuptools]
packages = ["apostate"]

[tool.setuptools.package-data]
apostate = ["*.sh"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
